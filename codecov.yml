codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 1%
    patch:
      default:
        target: 90%

fixes:
  - "expenses/::server/"

ignore:
  - "**/internal/wire/**"
  - "**/internal/database/migrations/**"
  - "**/pkg/database/manager/**"
  - "**/internal/mock/**"
  - "**/internal/server/**"
  - "**/pkg/logger/**"
